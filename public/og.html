<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1a1b1c;
      }
      iframe {
        display: block;
        border: 0;
        width: 1200px;
        height: 630px;
      }
    </style>
  </head>
  <body>
    <iframe id="f" src="/"></iframe>
    <script>
      const f = document.getElementById('f');
      f.addEventListener('load', () => {
        const doc = f.contentDocument;
        const hide = [
          '.nav',
          '.scroll-progress',
          '.hero-bottom',
          '.hero-reel',
          '.hero-metrics',
          '.hero-actions',
          '.skip-link',
        ];
        hide.forEach((selector) => {
          doc.querySelectorAll(selector).forEach((el) => {
            el.style.display = 'none';
          });
        });
        const body = doc.querySelector('.hero-body');
        if (body) body.style.maxWidth = '640px';
        doc.documentElement.style.overflow = 'hidden';
      });
    </script>
  </body>
</html>
